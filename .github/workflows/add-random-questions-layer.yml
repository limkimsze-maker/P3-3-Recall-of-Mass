name: Add random question layer
on:
  push:
    paths:
      - '.github/workflows/add-random-questions-layer.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Atomically add shared random question script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, base64, time, urllib.request, urllib.error
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          url=f'https://api.github.com/repos/{repo}/contents/index.html'
          tag='<script src="https://limkimsze-maker.github.io/P3-Length-Mass-and-Volume-Sports-Fiesta-/sports-fiesta-random-questions-v1.js?v=20260812a" data-practice="3"></script>'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for attempt in range(10):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as r:
                  data=json.load(r)
              text=base64.b64decode(data['content']).decode('utf-8')
              if 'sports-fiesta-random-questions-v1.js' in text:
                  print('Random question layer already present.')
                  raise SystemExit(0)
              new=text.replace('</body>',tag+'\n</body>')
              payload=json.dumps({'message':'Add reasonable random questions','content':base64.b64encode(new.encode()).decode(),'sha':data['sha'],'branch':'main'}).encode()
              put=urllib.request.Request(url,data=payload,headers={**headers,'Content-Type':'application/json'},method='PUT')
              try:
                  with urllib.request.urlopen(put) as r:
                      print(json.load(r)['commit']['sha'])
                  raise SystemExit(0)
              except urllib.error.HTTPError as e:
                  if e.code not in (409,422): raise
                  time.sleep(2)
          raise SystemExit('Could not update index.html after retries')
          PY
