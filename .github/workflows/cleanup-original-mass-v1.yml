name: Polish Original Mass Wording
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('for an pear?','for a pear?')
          s=s.replace('.ball.lemon','.ball.orange').replace('.turn.lemon','.turn.orange')
          s=s.replace('classList.toggle("lemon"','classList.toggle("orange"')
          s=s.replace('player===1?"lemon":""','player===1?"orange":""')
          p.write_text(s,encoding='utf-8')
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Polish original mass wording"
          git push
