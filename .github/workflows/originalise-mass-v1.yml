name: Original Mass Examples
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          changes={
          'watermelon':'pumpkin','🍉':'🎃','school bag':'travel bag','🎒':'🧳','bag of rice':'bag of potatoes','🍚':'🥔','cat':'small dog','🐈':'🐕','book':'magazine','📕':'📰','apple':'pear','🍎':'🍐','orange':'lemon','🍊':'🍋','pencil case':'crayon box','✏️':'🖍️','bottle':'shampoo bottle','biscuits':'crackers','🍪':'🥨',
          'm:4,u:"kg"},{n:"travel bag"':'m:3,u:"kg"},{n:"travel bag"',
          'm:3,u:"kg"},{n:"bag of potatoes"':'m:2,u:"kg"},{n:"bag of potatoes"',
          'm:5,u:"kg"},{n:"small dog"':'m:5,u:"kg"},{n:"small dog"',
          'm:4,u:"kg"},{n:"magazine"':'m:6,u:"kg"},{n:"magazine"',
          'm:450,u:"g"},{n:"pear"':'m:350,u:"g"},{n:"pear"',
          'm:180,u:"g"},{n:"lemon"':'m:160,u:"g"},{n:"lemon"',
          'm:220,u:"g"},{n:"crayon box"':'m:120,u:"g"},{n:"crayon box"',
          'm:300,u:"g"},{n:"shampoo bottle"':'m:280,u:"g"},{n:"shampoo bottle"',
          'm:700,u:"g"},{n:"crackers"':'m:650,u:"g"},{n:"crackers"',
          'm:250,u:"g"}];':'m:240,u:"g"}];',
          'Which is the most sensible mass for a travel bag?':'Which is the most sensible mass for a travel bag?',
          '["3 kg","3 g","300 g","30 kg"]':'["2 kg","2 g","200 g","20 kg"]',
          'a:"3 kg",x:"3 kg is sensible."':'a:"2 kg",x:"2 kg is a sensible estimate for a travel bag."',
          'Which is the most sensible mass for a pear?':'Which is the most sensible mass for a pear?',
          '["180 g","180 kg","18 kg","1 kg"]':'["160 g","160 kg","16 kg","2 kg"]',
          'a:"180 g",x:"180 g is sensible."':'a:"160 g",x:"160 g is a sensible estimate for a pear."'
          }
          for a,b in changes.items(): s=s.replace(a,b)
          hook='<script src="https://limkimsze-maker.github.io/P3-Length-Mass-and-Volume-Sports-Fiesta-/sports-fiesta-original-questions-v1.js?v=20260810a" data-practice="3"></script>\n'
          marker='<script src="https://limkimsze-maker.github.io/P3-Length-Mass-and-Volume-Sports-Fiesta-/sports-fiesta-medal-hook-v4.js'
          if 'sports-fiesta-original-questions-v1.js' not in s: s=s.replace(marker,hook+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Use original mass examples"
          git push
